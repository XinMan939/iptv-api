name: 清除cache缓存

on:
  schedule:
    # 每天清一次历史缓存，避免缓存长期沉淀。
    # 定在 13:00 UTC（北京 21:00）而不是 00:00，是为了躲开 update 任务：
    # update 也在 00:00 触发，但实测被队列延迟到 04:20~05:03 才开始，跑约 3.5 小时
    # （超时上限已提到 350 分钟，最晚约 10:50 结束）。两者同时跑的话，update 收尾时
    # 会把新生成的 cache.gz 连同结果一起 push 回来，这次清理就白做了。
    # 13:00 UTC 距 update 最晚收尾还有约 2 小时余量，且离下一次 update 有 15 小时，
    # 等于「更新后立刻清、下次更新必然是冷启动」。
    - cron: '0 13 * * *'
  workflow_dispatch:

# 缺这一段时 GITHUB_TOKEN 是只读的，git push 必然 403：
#   Permission to XinMan939/iptv-api.git denied to github-actions[bot]
permissions:
  contents: write

concurrency:
  group: iptv-clear-cache
  cancel-in-progress: false

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Delete cache.gz
        run: |
          if [ -f output/data/cache.gz ]; then
            rm -v output/data/cache.gz
            echo "DELETED=true" >> "$GITHUB_ENV"
          else
            echo "cache.gz not found, skip"
            echo "DELETED=false" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: env.DELETED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/data/cache.gz
          git commit -m "chore: 自动清除cache缓存 [skip ci]"
          git pull --rebase origin master
          git push origin master
