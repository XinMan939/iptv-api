name: 清除cache缓存

on:
  schedule:
    # 主清理已挪进 update.yml 的「Drop cache」步骤（跑完直接删，再提交），
    # 所以正常情况下 master 上不会再有 cache.gz，本任务多半只会输出 "not found"。
    # 它留下纯粹是兜底：更新任务中途异常退出、没走到删缓存那一步时，
    # 这份残留由这里每天清一次。
    # 时间留在 13:00 UTC（北京 21:00）：update 已改到 21:00 UTC（北京 05:00）起跑、
    # 约跑 3.5 小时，13:00 UTC 距它收尾有 12 小时以上，离下一次起跑还有 8 小时，两头都不撞。
    - cron: '0 13 * * *'
  workflow_dispatch:

# 缺这一段时 GITHUB_TOKEN 是只读的，git push 必然 403：
#   Permission to XinMan939/iptv-api.git denied to github-actions[bot]
permissions:
  contents: write

concurrency:
  group: iptv-clear-cache
  cancel-in-progress: false

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Delete cache.gz
        run: |
          if [ -f output/data/cache.gz ]; then
            rm -v output/data/cache.gz
            echo "DELETED=true" >> "$GITHUB_ENV"
          else
            echo "cache.gz not found, skip"
            echo "DELETED=false" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: env.DELETED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/data/cache.gz
          git commit -m "chore: 自动清除cache缓存 [skip ci]"
          git pull --rebase origin master
          git push origin master
