name: 清除cache缓存

on:
  schedule:
    - cron: '0 0 */3 * *'  # 每 3 天清理一次历史缓存，避免缓存长期沉淀
  workflow_dispatch:

# 缺这段时默认 GITHUB_TOKEN 只读，git push 会 403
# （日志里的 "Permission to XinMan939/iptv-api.git denied to github-actions[bot]"）
permissions:
  contents: write

concurrency:
  group: iptv-clear-cache
  cancel-in-progress: false

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Delete cache.gz
        run: |
          if [ -f output/data/cache.gz ]; then
            rm -v output/data/cache.gz
            echo "DELETED=true" >> "$GITHUB_ENV"
          else
            echo "cache.gz not found, skip"
            echo "DELETED=false" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: env.DELETED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A output/data/cache.gz
          git commit -m "chore: 自动清除cache缓存 [skip ci]"
          git pull --rebase origin master
          git push origin master
