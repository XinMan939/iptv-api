name: 娓呴櫎cache缂撳瓨

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  clear-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete cache.gz
        run: |
          if [ -f output/data/cache.gz ]; then
            rm -v output/data/cache.gz
            echo "DELETED=true" >> $GITHUB_ENV
          else
            echo "cache.gz not found, skip"
            echo "DELETED=false" >> $GITHUB_ENV
          fi

      - name: Commit and push
        if: env.DELETED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/data/cache.gz
          git commit -m "chore: 鑷姩娓呴櫎cache缂撳瓨"
          git push
