; ============================================
; 个人覆盖配置 / User overrides
; ============================================
; 说明：
; 1. 3.x 起 config.ini 保持上游原样（便于以后整体替换升级），
;    个人改动一律写在本文件，加载优先级：本文件 > config.ini > 环境变量覆盖
; 2. 这里只放与上游默认值不同的项，其余沿用 config.ini
; 3. 需要临时改某项，也可以直接在 Actions 里用环境变量覆盖（如 LOGO_URL=...）

[Settings]

; ---- 结果导出数量 ----
; 原 v2.0.7 的 urls_limit = 40，v3 起新键名是 output_urls_limit
output_urls_limit = 40
; 旧键保留同值，兼容读 urls_limit 的旧逻辑
urls_limit = 40

; ---- 测速 ----
; v3 默认 0 = 由 performance_mode 自动决定；这里显式固定 5，
; 与 v2.0.7 时期的行为一致（GitHub Runner 只有 2 核，自动值可能更低）
speed_test_limit = 5
; 关闭 M3U 内请求头校验信息的使用（原配置即为 False）
open_headers = False

; ---- 台标 ----
; 继续使用本仓库自带的 396 张台标库（config/logo）
logo_url = https://raw.githubusercontent.com/XinMan939/iptv-api/master/config/logo

; ---- 数据源 ----
; 保留「自动停用失效源」开关（v3 默认已改为 False）
; 注意：仅在本机/Docker 常驻运行时有效；GitHub Actions 每轮都是全新检出，
; 对 config/subscribe.txt 的修改不会回写，需配合提交 config/ 或改用 Docker 才有持久效果
open_auto_disable_source = True

; ---- 本地/自建部署时的定时设置（Actions 下由 workflow 的 cron 控制，此项不生效）----
update_interval = 24

; ---- 可选：国内访问加速 ----
; 填了之后 m3u 里的台标/EPG 地址会带上该前缀（如 https://gh-proxy.org/）
; 留空 = 直连 raw.githubusercontent.com
cdn_url =
